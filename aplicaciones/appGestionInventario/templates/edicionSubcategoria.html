{% extends "./base.html" %}

{% block title %}Editar Subcategoría{% endblock %}

{% block body %}

{% if messages %}
    <div class="alert alert-dismissible alert-success">
        {% for message in messages %}
        <strong class="text-dark">{{ message }}</strong>
        {% endfor %}
    </div>
{% endif %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="col-md-6">
        <h1 class="text-center mb-4">Editar Subcategoría</h1>
        <form action="{% url 'editarSubcategoria' subcategoria.id_subcategoria %}" method="POST" class="p-4 border rounded bg-light shadow-sm">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="txtNombre" class="form-label">Nuevo Nombre de la Subcategoría</label>
                <input type="text" id="txtNombre" name="txtNombre" class="form-control" value="{{ subcategoria.nombre }}" required>
            </div>
            <div class="d-flex justify-content-center gap-3 mt-4"> <!--justify-content-center alinea los botones en el centro del contenedor-->
                <button type="submit" class="btn btn-success px-4">Guardar</button>
                <a href="{% url 'gestionSubcategorias' subcategoria.categoria.id_categoria %}" class="btn btn-danger px-4">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
