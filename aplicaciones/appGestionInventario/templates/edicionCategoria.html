{% extends "./base.html" %}

{% block title %} Gestion de Categorias {% endblock %}

{% block body %}
<div class="row">
    <div class="col-md-4 offset-md-4">
        <h1 style="text-align: center;">Editar Categoría</h1>
        <div class="card ">
            <div class="card-body">
                <form action="{% url 'edicionCategoria' categoria.id_categoria %}" method="POST"> 
                    {% csrf_token %}
                    <input type="hidden" name="txtid_categoria" value="{{ categoria.id_categoria }}">
                    <div class="form-group mb-3">
                        <input type="text" id="txtNombre" name="txtNombre" value="{{categoria.nombre_categoria}}" class="form-control" placeholder="Nombre" maxlength="50" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="text" id="txtDescripcion" name="txtDescripcion" value="{{categoria.descripcion}}" class="form-control" placeholder="Descripción" maxlength="100">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-success btn-block text-white w-100">Guardar</button>
                    </div>
                </form>
            </div>
    </div>
</div>
{% endblock%}
