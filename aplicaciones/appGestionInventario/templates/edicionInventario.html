{% extends "./base.html" %}

{% block title %} Gestión de Inventario {% endblock %}

{% block body %}

<!-- Mensajes -->
{% if messages %}
<div class="alert alert-dismissible alert-success">
    {% for message in messages %}
    <strong class="text-dark">{{ message }}</strong>
    {% endfor %}
</div>
{% endif %}

<div class="row">
    <div class="col-md-6 offset-md-3">
        <h1 style="text-align: center;">Editar Ítem de Inventario</h1>
        <form action="{% url 'editarInventario' inventario.id %}" method="POST">
            {% csrf_token %}
            <!-- Datos del Inventario -->
            <div class="card">
                <div class="card-body">
                    <h3>Datos del Inventario</h3>
                    <!-- Nombre del Ítem -->
                    <div class="form-group mb-3">
                        <label for="nombre">Nombre del Ítem:</label>
                        <input type="text" id="nombre" name="nombre" value="{{ inventario.nombre }}"
                            class="form-control" placeholder="Nombre del Ítem" maxlength="100">
                    </div>

                    <!-- Cantidad Disponible -->
                    <div class="form-group mb-3">
                        <label for="cantidad_disponible">Cantidad Disponible:</label>
                        <input type="number" id="cantidad_disponible" name="cantidad_disponible"
                            value="{{ inventario.cantidad_disponible }}" class="form-control" min="0" step="0.01">
                    </div>

                    <!-- Unidad de Medida -->
                    <div class="form-group mb-3">
                        <label for="unidad_medida">Unidad de Medida:</label>
                        <input type="text" id="unidad_medida" name="unidad_medida"
                            value="{{ inventario.unidad_medida }}" class="form-control"
                            placeholder="Unidad de Medida (ml, gr, unidades)">
                    </div>

                    <!-- Descripción -->
                    <div class="form-group mb-3">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" class="form-control"
                            placeholder="Descripción">{{ inventario.descripcion }}</textarea>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
