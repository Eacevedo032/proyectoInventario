{% extends "./base.html" %}

{% block title %}Editar Horario{% endblock %}

{% block head %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/estilosSolicitudes.css' %}">
{% endblock %}

{% block body %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <h1 class=".horario-title text-center mb-4">Editar Horario</h1>

            <form method="post" action="" id="editarHorarioForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="laboratorio" class="form-label">Laboratorio:</label>
                    <select id="laboratorio" name="laboratorio" class="form-control" required>
                        <option value="Laboratorio Planta Alta" {% if horario.laboratorio == "Laboratorio Planta Alta" %}selected{% endif %}>Laboratorio Planta Alta</option>
                        <option value="Laboratorio Planta Baja" {% if horario.laboratorio == "Laboratorio Planta Baja" %}selected{% endif %}>Laboratorio Planta Baja</option>
                        <option value="Laboratorio Microbiana" {% if horario.laboratorio == "Laboratorio Microbiana" %}selected{% endif %}>Laboratorio Microbiana</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="fecha_reserva" class="form-label">Fecha de Reserva:</label>
                    <input type="date" class="form-control" id="fecha_reserva" name="fecha_reserva" value="{{ fecha_reserva }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hora de Inicio:</label>
                    <div class="row">
                        <div class="col-5">
                            <select id="hora_inicio" name="hora_inicio" class="form-control" required>
                                <option value="">Hora</option>
                                {% for i in "x"|rjust:"12" %}
                                <option value="{{ forloop.counter }}" {% if hora_inicio_12h.hora == forloop.counter %}selected{% endif %}>
                                    {{ forloop.counter }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-5">
                            <select id="minuto_inicio" name="minuto_inicio" class="form-control" required>
                                <option value="">Minutos</option>
                                {% for i in "x"|rjust:"60" %}
                                <option value="{{ forloop.counter0 }}" {% if hora_inicio_12h.minuto == forloop.counter0 %}selected{% endif %}>
                                    {{ forloop.counter0|stringformat:"02d" }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-2">
                            <select id="periodo_inicio" name="periodo_inicio" class="form-control" required>
                                <option value="AM" {% if hora_inicio_12h.periodo == "AM" %}selected{% endif %}>AM</option>
                                <option value="PM" {% if hora_inicio_12h.periodo == "PM" %}selected{% endif %}>PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hora de Fin:</label>
                    <div class="row">
                        <div class="col-5">
                            <select id="hora_fin" name="hora_fin" class="form-control" required>
                                <option value="">Hora</option>
                                {% for i in "x"|rjust:"12" %}
                                <option value="{{ forloop.counter }}" {% if hora_fin_12h.hora == forloop.counter %}selected{% endif %}>
                                    {{ forloop.counter }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-5">
                            <select id="minuto_fin" name="minuto_fin" class="form-control" required>
                                <option value="">Minutos</option>
                                {% for i in "x"|rjust:"60" %}
                                <option value="{{ forloop.counter0 }}" {% if hora_fin_12h.minuto == forloop.counter0 %}selected{% endif %}>
                                    {{ forloop.counter0|stringformat:"02d" }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-2">
                            <select id="periodo_fin" name="periodo_fin" class="form-control" required>
                                <option value="AM" {% if hora_fin_12h.periodo == "AM" %}selected{% endif %}>AM</option>
                                <option value="PM" {% if hora_fin_12h.periodo == "PM" %}selected{% endif %}>PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="sin_supervision" name="sin_supervision" {% if horario.sin_supervision %}checked{% endif %}>
                    <label class="form-check-label" for="sin_supervision">Horario bloqueado (sin supervisión)</label>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    <a href="{% url 'listar_horarios' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Configurar el formulario para convertir a formato militar antes de enviar
    const form = document.getElementById('editarHorarioForm');
    
    form.addEventListener('submit', function(e) {
        // Convertir hora de inicio
        const horaInicio = parseInt(document.getElementById('hora_inicio').value);
        const minutoInicio = document.getElementById('minuto_inicio').value;
        const periodoInicio = document.getElementById('periodo_inicio').value;
        
        let horaInicio24 = horaInicio;
        if (periodoInicio === 'PM' && horaInicio !== 12) {
            horaInicio24 += 12;
        } else if (periodoInicio === 'AM' && horaInicio === 12) {
            horaInicio24 = 0;
        }
        
        // Convertir hora de fin
        const horaFin = parseInt(document.getElementById('hora_fin').value);
        const minutoFin = document.getElementById('minuto_fin').value;
        const periodoFin = document.getElementById('periodo_fin').value;
        
        let horaFin24 = horaFin;
        if (periodoFin === 'PM' && horaFin !== 12) {
            horaFin24 += 12;
        } else if (periodoFin === 'AM' && horaFin === 12) {
            horaFin24 = 0;
        }
        
        // Actualizar campos ocultos con formato HH:MM
        document.getElementById('hora_inicio_militar').value = `${horaInicio24.toString().padStart(2, '0')}:${minutoInicio}`;
        document.getElementById('hora_fin_militar').value = `${horaFin24.toString().padStart(2, '0')}:${minutoFin}`;
    });
});
</script>
{% endblock %}
