<!--admin-->
{% extends "./base.html" %}

{% block title %}Editar Horario{% endblock %}

{% block body %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Mostrar mensajes de error/éxito -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <h1 class="text-center mb-4">Editar Horario</h1>

            <form method="post" action="">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="laboratorio" class="form-label">Laboratorio:</label>
                    <input type="text" class="form-control" id="laboratorio" name="laboratorio" value="{{ horario.laboratorio }}" required>
                </div>

                <div class="mb-3">
                    <label for="fecha_reserva" class="form-label">Fecha de Reserva:</label>
                    <input type="date" class="form-control" id="fecha_reserva" name="fecha_reserva" value="{{ horario.fecha_reserva }}" required>
                </div>

                <div class="mb-3">
                    <label for="hora_inicio" class="form-label">Hora de Inicio:</label>
                    <input type="time" class="form-control" id="hora_inicio" name="hora_inicio" value="{{ horario.hora_inicio }}" required>
                </div>

                <div class="mb-3">
                    <label for="hora_fin" class="form-label">Hora de Fin:</label>
                    <input type="time" class="form-control" id="hora_fin" name="hora_fin" value="{{ horario.hora_fin }}" required>
                </div>

                <div class="form-check mb-3">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        id="sin_supervision" 
                        name="sin_supervision" 
                        {% if horario.sin_supervision %}checked{% endif %}>
                    <label class="form-check-label" for="sin_supervision">Horario bloqueado (sin supervisión)</label>
                </div>

                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{% url 'listar_horarios' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
